# Desktop builds: Linux (AppImage, deb, zip) here or on CI, Windows (installer, zip) and macOS (dmg, zip) on CI.
# Unsigned for now: Windows SmartScreen and macOS Gatekeeper ask once on first open (docs/DESKTOP.md).
appId: io.github.teo-clerk.mdlearn
productName: MDlearn
copyright: Copyright © 2026 Teo Clerk
artifactName: MDlearn-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build-res
files:
  - dist/**
  - package.json
extraResources:
  - from: build-res/icon.png
    to: icon.png
afterPack: ./after-pack.cjs # copies build/server into resources/server
asar: true
npmRebuild: false
publish: null
linux:
  target: [AppImage, deb, zip]
  executableName: mdlearn
  syncDesktopName: true
  category: Education
  icon: build-res/icon.png
  synopsis: Read Markdown notes, study them, and turn them into courses
  maintainer: Teo Clerk <teo-clerk@users.noreply.github.com>
win:
  target: [nsis, zip]
  icon: build-res/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.education
  icon: build-res/icon.png
  identity: "-"
