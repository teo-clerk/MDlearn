# Every push to master and every pull request: unit tests on all three systems, type checks and the documents'
# examples once, and the browser tests on Linux.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the real Claude Code the way most Windows users do
        if: runner.os == 'Windows'
        run: npm install --global @anthropic-ai/claude-code@2.1.303
      - run: npm test
        env:
          MDLEARN_REAL_CLAUDE: ${{ runner.os == 'Windows' && '1' || '' }}
      - run: npm run typecheck
        if: runner.os == 'Linux'
      - run: npm run check-docs
        if: runner.os == 'Linux'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: packages/studio
      - run: npm run test:e2e -w @mdlearn/studio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: packages/studio/test-results
          retention-days: 7
